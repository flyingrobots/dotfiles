# Enable mouse mode (scrolling, clicking, resizing panes)
set -g mouse on

# True color support
set -g default-terminal "screen-256color"
set -as terminal-features ",xterm-256color:RGB"

# Enable OSC 52 clipboard (copies selections directly to your local laptop clipboard over SSH)
set -s set-clipboard on

# Eliminate escape delay for Neovim / Vim
set -s escape-time 0

# Increase scrollback buffer
set -g history-limit 50000

# Start numbering windows and panes at 1 for easy keyboard reach
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Smart pane switching with awareness of Vim splits (vim-tmux-navigator)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

# tmux-sessionizer (Ctrl-f to fuzzy-switch projects anywhere in tmux)
bind-key -n C-f run-shell "tmux neww /Users/j/.local/bin/tmux-sessionizer"
bind-key -r f run-shell "tmux neww /Users/j/.local/bin/tmux-sessionizer"

# Tmux Session Persistence (tmux-resurrect & tmux-continuum)
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux
run-shell ~/.tmux/plugins/tmux-continuum/continuum.tmux
